<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="auto">
  <defs>
    <!-- Gradiente de destaque roxo elétrico -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Gradiente da barra de progresso com brilho -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Sombra suave do card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      /* Animação de pulso no indicador de status */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.18); }
      }

      /* Animação contínua da barra de progresso */
      @keyframes fillProgress {
        0% { width: 40px; }
        50% { width: 260px; }
        100% { width: 40px; }
      }

      /* Efeito de leitura/varredura suave nas tarefas */
      @keyframes scanRow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .pulse-circle {
        animation: pulseGlow 2.5s ease-in-out infinite;
        transform-origin: 390px 48px;
      }

      .progress-bar-fill {
        animation: fillProgress 4s ease-in-out infinite;
      }

      .task-item-1 { animation: scanRow 3s ease-in-out infinite; }
      .task-item-2 { animation: scanRow 3s ease-in-out infinite 1s; }
      .task-item-3 { animation: scanRow 3s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Corpo Principal do Card -->
  <rect x="10" y="10" width="440" height="355" rx="22" fill="#13151f" stroke="#252838" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Barra Superior com Controles de Janela -->
  <circle cx="36" cy="38" r="5" fill="#ef4444"/>
  <circle cx="52" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="68" cy="38" r="5" fill="#10b981"/>

  <!-- Indicador de Status Ativo no topo direito -->
  <circle class="pulse-circle" cx="390" cy="38" r="10" fill="#6366f1" opacity="0.3"/>
  <circle cx="390" cy="38" r="5" fill="#818cf8"/>
  <text x="402" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">LIVE</text>

  <!-- Linha divisória interna -->
  <line x1="10" y1="64" x2="450" y2="64" stroke="#222533" stroke-width="1"/>

  <!-- Título do Bloco Interno -->
  <text x="36" y="98" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Métricas de Execução</text>
  <text x="36" y="116" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Processos sincronizados em tempo real</text>

  <!-- Item de Tarefa 1 -->
  <g class="task-item-1" transform="translate(36, 136)">
    <rect width="368" height="42" rx="10" fill="#1b1e2c" stroke="#2c3044" stroke-width="1"/>
    <!-- Checkmark Badge -->
    <rect x="12" y="11" width="20" height="20" rx="6" fill="url(#purpleGrad)"/>
    <path d="M17 21 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">Automação de rotinas diárias</text>
  </g>

  <!-- Item de Tarefa 2 -->
  <g class="task-item-2" transform="translate(36, 188)">
    <rect width="368" height="42" rx="10" fill="#1b1e2c" stroke="#2c3044" stroke-width="1"/>
    <rect x="12" y="11" width="20" height="20" rx="6" fill="url(#purpleGrad)"/>
    <path d="M17 21 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">Otimização de tempo e foco</text>
  </g>

  <!-- Item de Tarefa 3 -->
  <g class="task-item-3" transform="translate(36, 240)">
    <rect width="368" height="42" rx="10" fill="#1b1e2c" stroke="#2c3044" stroke-width="1"/>
    <rect x="12" y="11" width="20" height="20" rx="6" fill="url(#purpleGrad)"/>
    <path d="M17 21 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">Relatórios sem intervenção manual</text>
  </g>

  <!-- Barra de Progresso Animada Inferior -->
  <g transform="translate(36, 304)">
    <rect width="368" height="20" rx="10" fill="#181a26" stroke="#2c3044" stroke-width="1"/>
    <rect class="progress-bar-fill" x="2" y="2" width="120" height="16" rx="8" fill="url(#progressGrad)"/>
  </g>
</svg>

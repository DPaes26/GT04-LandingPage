<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Gradiente de Fundo do Editor (Dark Theme) -->
    <linearGradient id="editorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Gradiente de Borda do Card de Código -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Luzes Ambiente Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Total -->
  <rect width="1584" height="396" fill="url(#editorBg)" />

  <!-- Luzes de Fundo -->
  <circle cx="1300" cy="80" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="900" cy="320" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Grelha Sutil de Código no Fundo -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="66" x2="1584" y2="66" />
    <line x1="0" y1="132" x2="1584" y2="132" />
    <line x1="0" y1="198" x2="1584" y2="198" />
    <line x1="0" y1="264" x2="1584" y2="264" />
    <line x1="0" y1="330" x2="1584" y2="330" />
    <line x1="450" y1="0" x2="450" y2="396" />
    <line x1="800" y1="0" x2="800" y2="396" />
    <line x1="1150" y1="0" x2="1150" y2="396" />
  </g>

  <!-- Indicador Visual da Área Segura (Esquerda Livre para a Foto) -->
  <!-- O código começa a partir dos 430px de largura -->

  <!-- Janela do Editor IDE -->
  <g transform="translate(420, 24)">
    <!-- Moldura da Janela -->
    <rect width="1120" height="348" rx="14" fill="#131722" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Barra de Título da Janela -->
    <rect width="1120" height="42" rx="14" fill="#181d2c" />
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    <text x="90" y="26" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" font-weight="500">DaniellyPaes.java</text>

    <!-- Linha divisória da barra de título -->
    <line x1="0" y1="42" x2="1120" y2="42" stroke="#22283a" stroke-width="1" />

    <!-- Numeração das Linhas -->
    <g fill="#475569" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" text-anchor="end">
      <text x="36" y="76">1</text>
      <text x="36" y="104">2</text>
      <text x="36" y="132">3</text>
      <text x="36" y="160">4</text>
      <text x="36" y="188">5</text>
      <text x="36" y="216">6</text>
      <text x="36" y="244">7</text>
      <text x="36" y="272">8</text>
      <text x="36" y="300">9</text>
      <text x="36" y="328">10</text>
    </g>

    <!-- Linha vertical divisória dos números -->
    <line x1="50" y1="42" x2="50" y2="348" stroke="#1e2436" stroke-width="1" />

    <!-- Código Java Formatado -->
    <g transform="translate(68, 0)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13.5" font-weight="500">
      
      <!-- Linha 1 -->
      <text y="76" fill="#c084fc">public class <tspan fill="#67e8f9">DaniellyPaes</tspan> {</text>

      <!-- Linha 2 -->
      <text y="104" x="22" fill="#c084fc">public static void <tspan fill="#60a5fa">main</tspan>(<tspan fill="#facc15">String</tspan>[] args) {</text>

      <!-- Linha 3 -->
      <text y="132" x="44" fill="#94a3b8"><tspan fill="#facc15">String</tspan> dev = <tspan fill="#a7f3d0">"Danielly Paes"</tspan>;</text>

      <!-- Linha 4 -->
      <text y="160" x="44" fill="#94a3b8"><tspan fill="#facc15">String</tspan> role = <tspan fill="#a7f3d0">"Desenvolvedora de Software | TI Sistema FIEC"</tspan>;</text>

      <!-- Linha 5 -->
      <text y="188" x="44" fill="#94a3b8"><tspan fill="#facc15">String</tspan>[] stack = {<tspan fill="#a7f3d0">"Java"</tspan>, <tspan fill="#a7f3d0">"Spring Boot"</tspan>, <tspan fill="#a7f3d0">"PostgreSQL"</tspan>, <tspan fill="#a7f3d0">"Git"</tspan>};</text>

      <!-- Linha 6 -->
      <text y="216" x="44" fill="#94a3b8"><tspan fill="#facc15">String</tspan> hobby = <tspan fill="#a7f3d0">"Baterista nas horas vagas 🥁"</tspan>;</text>

      <!-- Linha 7 -->
      <text y="244" x="44" fill="#94a3b8"><tspan fill="#c084fc">boolean</tspan> focoTotal = <tspan fill="#f472b6">true</tspan>;</text>

      <!-- Linha 8 -->
      <text y="272" x="44" fill="#67e8f9">System<tspan fill="#94a3b8">.out.</tspan><tspan fill="#60a5fa">println</tspan><tspan fill="#94a3b8">(focoTotal ? </tspan><tspan fill="#a7f3d0">"Construindo soluções com código limpo."</tspan><tspan fill="#94a3b8"> : </tspan><tspan fill="#a7f3d0">"Carregando..."</tspan><tspan fill="#94a3b8">);</tspan></text>

      <!-- Linha 9 -->
      <text y="300" x="22" fill="#c084fc">}</text>

      <!-- Linha 10 -->
      <text y="328" fill="#c084fc">}</text>
    </g>
  </g>
</svg>
